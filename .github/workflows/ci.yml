name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore PremierLeagueCopilot.sln

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build PremierLeagueCopilot.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test PremierLeagueCopilot.sln --configuration Release --no-build

      - name: Validate EF Core migrations
        run: >-
          dotnet tool run dotnet-ef migrations script --idempotent
          --project backend/backend.csproj
          --startup-project backend/backend.csproj
          --no-build
          --configuration Release
          --output $RUNNER_TEMP/application-persistence.sql

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: fpl-frontend:ci

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: fpl-backend:ci